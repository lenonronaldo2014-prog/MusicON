name: Build MusicON Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Dart
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub --timeout=60s
          exit $LASTEXITCODE
      - name: Build installer and portable app
        shell: pwsh
        run: ./tool/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MusicON-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7
